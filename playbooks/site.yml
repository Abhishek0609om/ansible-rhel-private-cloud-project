---
# Task 1: Common configuration
- name: Apply base configuration
  hosts: all:!control
  become: true
  tasks:
    - name: Clear package manager locks cleanly to avoid lock conflicts
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/run/dnf.pid
        - /var/cache/dnf/metadata_lock.pid

    - name: Install required packages using lightweight native module
      dnf:
        name:
          - vim
          - curl
          - wget
          - firewalld
          - python3-firewall
        state: present
        update_cache: true

    - name: Start firewalld
      service:
        name: firewalld
        state: started
        enabled: true


# Task 2: Configure web servers
- name: Configure web servers
  hosts: webservers
  become: true
  tasks:
    - name: Install Apache
      shell: dnf install -y httpd

    - name: Disable default Red Hat welcome page config file
      file:
        path: /etc/httpd/conf.d/welcome.conf
        state: absent # FIXED: Forcefully drops the stock page block

    - name: Start Apache
      service:
        name: httpd
        state: started
        enabled: true

    - name: Open firewall for HTTP
      shell: firewall-cmd --permanent --add-service=http

    - name: Reload firewall
      shell: firewall-cmd --reload

# Task 3 : Load Balancer Configuration
- name: Configure HAProxy Load Balancer
  hosts: lb
  become: true
  tasks:
    - name: Install HAProxy package
      dnf:
        name: haproxy
        state: present

    - name: Deploy clean custom HAProxy configuration
      copy:
        dest: /etc/haproxy/haproxy.cfg
        content: |
          global
              log /dev/log local0
              chroot /var/lib/haproxy
              user haproxy
              group haproxy
              daemon

          defaults
              log global
              mode http
              timeout connect 5000ms
              timeout client 50000ms
              timeout server 50000ms

          frontend http_front
              bind *:80
              default_backend http_back

          backend http_back
              balance roundrobin
              server web1 172.31.1.39:80 check
              server web2 172.31.1.65:80 check

    - name: Start and enable HAProxy service
      service:
        name: haproxy
        state: started
        enabled: true

    - name: Allow HTTP traffic in load balancer firewall
      command: firewall-cmd --permanent --add-service=http
      changed_when: true

    - name: Reload load balancer firewall
      command: firewall-cmd --reload
      changed_when: true

# Task 4 : Centralized NFS Storage Configuration
- name: Configure Centralized NFS Storage Server
  hosts: storage
  become: true
  tasks:
    - name: Install NFS utility packages
      dnf:
        name: nfs-utils
        state: present

    - name: Create the shared web assets export directory
      file:
        path: /var/nfsshare/html
        state: directory
        mode: '0777'
        owner: nobody
        group: nobody

    - name: Configure the NFS export access control list
      copy:
        dest: /etc/exports
        content: "/var/nfsshare/html 172.31.0.0/16(rw,sync,no_root_squash,no_all_squash)"

    - name: Start and enable core NFS server daemons
      service:
        name: nfs-server
        state: restarted
        enabled: true

    - name: Open firewall zones for storage traffic services
      command: firewall-cmd --permanent --add-service={{ item }}
      loop:
        - nfs
        - rpc-bind
        - mountd
      changed_when: true

    - name: Reload storage firewall rules
      command: firewall-cmd --reload
      changed_when: true

# Task 5 : Mount Centralized NFS Storage on Web Servers
- name: Mount Centralized NFS Storage on Web Client Nodes
  hosts: webservers
  become: true
  tasks:
    - name: Ensure NFS client helper utilities are present
      dnf:
        name: nfs-utils
        state: present
        
    - name: Mount NFS share    
      ansible.posix.mount:
        src: "172.31.1.207:/var/nfsshare/html" 
        path: /var/www/html
        fstype: nfs
        opts: rw,sync
        state: mounted 

    - name: Create synchronized master index file inside the mounted storage root
      copy:
        content: "<h1>Welcome to the Private Cloud Cluster via Shared NFS Storage!</h1>"
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Configure SELinux to allow Apache to read NFS directories
      ansible.posix.seboolean:
        name: httpd_use_nfs
        state: true
        persistent: true

    - name: Fix SELinux file context permissions on the web root path
      shell: chcon -R -t httpd_sys_content_t /var/www/html
      failed_when: false

    - name: Restart Apache web service to flush welcome file handle state
      service:
        name: httpd
        state: restarted


# Task 6 : Relational Database Node Configuration
- name: Configure Secure Relational Database Node
  hosts: db
  become: true
  tasks:
    - name: Install MariaDB Server packages
      dnf:
        name:
          - mariadb-server
          - mariadb
        state: present

    - name: Start and enable MariaDB engine service
      service:
        name: mariadb
        state: started
        enabled: true

    - name: Allow MariaDB MySQL traffic through database firewall
      command: firewall-cmd --permanent --add-service=mysql
      changed_when: true

    - name: Reload database firewall system rules
      command: firewall-cmd --reload
      changed_when: true

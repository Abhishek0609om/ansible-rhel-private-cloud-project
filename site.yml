---
# Task 1 : common configuration for all servers
- name: Apply base configuration to all servers
  hosts: all:!control
  become: true
  tasks:
    # REMOVED: Full OS system upgrade to prevent t3.micro memory exhaustion (rc 137)

    - name: Install common packages and system firewall tools
      yum:
        name:
          - vim
          - git
          - curl
          - wget
          - python3-firewall  # FIXED: Added required Python library for firewall module
        state: present

# Task 2 : specific configuration for web servers
- name: Configure web Application servers
  hosts: webservers
  become: true
  tasks:
    - name: Install Apache web server
      yum:
        name: httpd
        state: present

    - name: Start and enable Apache service
      service:
        name: httpd
        state: started
        enabled: true

    - name: Deploy a dynamic test homepage 
      copy:
        content: "<h1>welcome to the web server {{ ansible_hostname }}</h1>"
        dest: /var/www/html/index.html
        mode: '0644'

    - name: ALLOW hTTP traffic in firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true

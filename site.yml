---
# Common configuration
- name: Apply base configuration
  hosts: all:!control
  become: true

  tasks:
    - name: Clean package cache
      shell: |
        rm -rf /var/cache/dnf/*
        dnf clean all

    - name: Install required packages
      shell: |
        dnf install -y vim curl wget firewalld

    - name: Start firewalld
      service:
        name: firewalld
        state: started
        enabled: true

# Configure web servers
- name: Configure web servers
  hosts: webservers
  become: true

  tasks:
    - name: Install Apache
      shell: dnf install -y httpd

    - name: Start Apache
      service:
        name: httpd
        state: started
        enabled: true

    - name: Create test page
      copy:
        content: "<h1>Welcome to {{ ansible_hostname }}</h1>"
        dest: /var/www/html/index.html

    - name: Open firewall for HTTP
      shell: firewall-cmd --permanent --add-service=http

    - name: Reload firewall
      shell: firewall-cmd --reload

# Task 3 : Load Balancer Configuration
- name: Configure HAProxy Load Balancer
  hosts: lb
  become: true
  tasks:
    - name: Install HAProxy package
      yum:
        name: haproxy
        state: present

    - name: Deploy clean custom HAProxy configuration
      copy:
        dest: /etc/haproxy/haproxy.cfg
        content: |
          global
              log /dev/log local0
              chroot /var/lib/haproxy
              user haproxy
              group haproxy
              daemon

          defaults
              log global
              mode http
              timeout connect 5000ms
              timeout client 50000ms
              timeout server 50000ms

          frontend http_front
              bind *:80
              default_backend http_back

          backend http_back
              balance roundrobin
              server web1 172.31.1.155:80 check
              server web2 172.31.1.88:80 check

    - name: Start and enable HAProxy service
      service:
        name: haproxy
        state: started
        enabled: true

    - name: Allow HTTP traffic in load balancer firewall
      command: firewall-cmd --permanent --add-service=http
      changed_when: true

    - name: Reload load balancer firewall
      command: firewall-cmd --reload
      changed_when: true

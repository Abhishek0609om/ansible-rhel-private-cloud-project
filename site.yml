---
# Task 1 : common configuration for all servers
- name: Apply base configuration to all servers
  hosts: all:!control
  become: true
  serial: 1

  tasks:
    - name: Clean package manager cache
      command: dnf clean all

    - name: Install common packages
      dnf:
        name:
          - vim
          - git
          - curl
          - wget
          - firewalld
        state: present

    - name: Start and enable firewalld
      service:
        name: firewalld
        state: started
        enabled: true


# Task 2 : specific configuration for web servers
- name: Configure web application servers
  hosts: webservers
  become: true

  tasks:
    - name: Install Apache
      dnf:
        name: httpd
        state: present

    - name: Start Apache
      service:
        name: httpd
        state: started
        enabled: true

    - name: Deploy test page
      copy:
        content: "<h1>Welcome to {{ ansible_hostname }}</h1>"
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Allow HTTP traffic
      firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true
---
# Common configuration

- name: Apply base configuration
  hosts: all:!control
  become: true
  serial: 1

  tasks:

    - name: Clean package cache
      shell: |
        rm -rf /var/cache/dnf/*
        dnf clean all

    - name: Install required packages
      shell: |
        dnf install -y vim curl wget firewalld

    - name: Start firewalld
      service:
        name: firewalld
        state: started
        enabled: yes


# Configure web servers

- name: Configure web servers
  hosts: webservers
  become: true

  tasks:

    - name: Install Apache
      shell: dnf install -y httpd

    - name: Start Apache
      service:
        name: httpd
        state: started
        enabled: yes

    - name: Create test page
      copy:
        content: "<h1>Welcome to {{ ansible_hostname }}</h1>"
        dest: /var/www/html/index.html

    - name: Open firewall for HTTP
      shell: firewall-cmd --permanent --add-service=http

    - name: Reload firewall
      shell: firewall-cmd --reload
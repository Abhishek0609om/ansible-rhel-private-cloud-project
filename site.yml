---
# Task 1 : Common configuration

- name: Apply base configuration to all servers
  hosts: all:!control
  become: true
  serial: 1

  tasks:

    - name: Clean package cache
      shell: dnf clean all

    - name: Install required common packages only
      yum:
        name:
          - vim
          - curl
          - wget
          - firewalld
        state: present

    - name: Start and enable firewalld
      service:
        name: firewalld
        state: started
        enabled: true


# Task 2 : Configure web servers

- name: Configure Web Application servers
  hosts: webservers
  become: true

  tasks:

    - name: Install Apache
      yum:
        name: httpd
        state: present

    - name: Start Apache
      service:
        name: httpd
        state: started
        enabled: true

    - name: Create test page
      copy:
        content: "<h1>Welcome to {{ ansible_hostname }}</h1>"
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Open HTTP in firewall
      shell: firewall-cmd --permanent --add-service=http

    - name: Reload firewall
      shell: firewall-cmd --reload
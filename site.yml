---
# Task 1 : common configuration for all servers
- name: Apply base configuration to all servers
  hosts: all:!control
  become: true
  tasks:
    - name: Clean package manager cache to fix corruption
      command: dnf clean all

    - name: Install common packages and force fresh firewall utilities
      yum:
        name:
          - vim
          - git
          - curl
          - wget
          - firewalld
          - python3-firewall
        state: present

    - name: Force start and enable firewalld daemon service
      service:
        name: firewalld
        state: restarted
        enabled: true

# Task 2 : specific configuration for web servers
- name: Configure web Application servers
  hosts: webservers
  become: true
  tasks:
    - name: Install Apache web server
      yum:
        name: httpd
        state: present

    - name: Start and enable Apache service
      service:
        name: httpd
        state: started
        enabled: true

    - name: Deploy a dynamic test homepage 
      copy:
        content: "<h1>welcome to the web server {{ ansible_hostname }}</h1>"
        dest: /var/www/html/index.html
        mode: '0644'

    - name: ALLOW HTTP traffic using bulletproof system command
      command: firewall-cmd --permanent --add-service=http
      changed_when: true

    - name: Reload firewall daemon to apply the change
      command: firewall-cmd --reload
      changed_when: true
